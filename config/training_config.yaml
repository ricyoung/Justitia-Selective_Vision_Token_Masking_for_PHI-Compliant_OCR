# Training Configuration for PHI Detection LoRA

# Data Configuration
data:
  train_dir: "./data/pdfs/train"
  val_dir: "./data/pdfs/val"
  test_dir: "./data/pdfs/test"
  annotations_dir: "./data/annotations"

  # Data split ratios
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # Synthetic data generation
  synthea:
    enabled: true
    num_patients: 1000
    num_documents_per_patient: 5
    output_dir: "./data/synthetic"

  # PDF generation settings
  pdf_generation:
    dpi: 150
    page_size: "letter"  # or "A4"
    font_variations: true
    noise_level: 0.1  # Add realistic scan noise
    rotation_range: [-2, 2]  # Degrees of random rotation

  # Data augmentation
  augmentation:
    enabled: true
    random_crop: true
    color_jitter: true
    gaussian_noise: true
    perspective_transform: true
    elastic_transform: false

# Training Parameters
training:
  # Basic settings
  num_epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 4  # Effective batch size = 32
  learning_rate: 2e-4
  warmup_steps: 500
  weight_decay: 0.01

  # Learning rate scheduler
  scheduler:
    type: "cosine"  # "linear", "cosine", "polynomial"
    num_cycles: 1
    min_lr: 1e-6

  # Optimizer
  optimizer:
    type: "adamw"  # "adam", "adamw", "sgd"
    betas: [0.9, 0.999]
    eps: 1e-8

  # LoRA specific
  lora:
    enabled: true
    merge_weights: false  # Merge LoRA weights after training
    quantization: null  # Options: null, "4bit", "8bit"

  # Mixed precision training
  mixed_precision:
    enabled: true
    dtype: "fp16"  # "fp16" or "bf16"

  # Gradient settings
  gradient_clipping: 1.0
  gradient_checkpointing: true

  # Early stopping
  early_stopping:
    enabled: true
    patience: 3
    min_delta: 0.001
    metric: "val_f1_score"
    mode: "max"  # "min" or "max"

# Loss Functions
loss:
  # Multi-task learning weights
  ocr_weight: 0.3
  phi_detection_weight: 0.7

  # PHI detection loss
  phi_loss:
    type: "focal"  # "cross_entropy", "focal", "dice"
    focal_alpha: 0.25
    focal_gamma: 2.0
    class_weights: "balanced"  # Handle class imbalance

  # Auxiliary losses
  consistency_loss_weight: 0.1  # Consistency between masking strategies
  attention_loss_weight: 0.05  # Guide attention to non-PHI regions

# Evaluation Metrics
evaluation:
  metrics:
    - "precision"
    - "recall"
    - "f1_score"
    - "accuracy"
    - "auc_roc"
    - "phi_removal_rate"
    - "ocr_retention_rate"

  # Per-category evaluation
  per_category_metrics: true

  # Confidence calibration
  calibration:
    enabled: true
    method: "temperature_scaling"

  # Error analysis
  save_predictions: true
  save_attention_maps: false
  error_analysis_samples: 100

# Checkpointing
checkpointing:
  save_dir: "./models/checkpoints"
  save_every_n_epochs: 1
  save_best_only: false
  keep_last_n_checkpoints: 3

  # Model selection
  best_model_metric: "val_f1_score"
  best_model_mode: "max"

# Hardware Configuration
hardware:
  device: "cuda"  # "cuda", "cpu", or "mps" (Mac)
  num_workers: 4  # DataLoader workers
  pin_memory: true

  # Distributed training (if using multiple GPUs)
  distributed:
    enabled: false
    backend: "nccl"  # "nccl", "gloo"
    world_size: 1
    local_rank: -1

# Logging and Monitoring
logging:
  # Weights & Biases
  wandb:
    enabled: true
    project: "justitia-phi-ocr"
    entity: null  # Your wandb entity
    tags: ["phi-detection", "lora", "deepseek-ocr"]
    log_frequency: 50  # Log every N steps

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "./logs/tensorboard"

  # Console logging
  console:
    level: "INFO"
    log_every_n_steps: 10

# Experiment Configuration
experiment:
  name: "phi_detection_lora_v1"
  description: "LoRA fine-tuning for PHI detection at vision token level"
  seed: 42
  deterministic: true  # For reproducibility

  # Ablation studies
  ablation:
    test_token_replacement: true
    test_selective_attention: true
    test_hybrid: true
    compare_with_text_only: true

# Data Processing Pipeline
pipeline:
  # Preprocessing steps
  preprocessing:
    - "resize"
    - "normalize"
    - "add_noise"  # Simulate scan artifacts
    - "rotate"  # Random small rotations

  # PHI annotation pipeline
  annotation:
    use_presidio: true  # Use Presidio for initial annotations
    manual_review: false  # Enable for production
    confidence_threshold: 0.8

# Validation Settings
validation:
  run_every_n_epochs: 1
  run_at_start: true
  verbose: true

  # Special validation modes
  zero_shot_eval: true  # Test without fine-tuning
  few_shot_eval: false  # Test with minimal examples
  cross_dataset_eval: false  # Test on different datasets

# Testing Configuration
testing:
  test_on_best_model: true
  save_test_outputs: true
  generate_report: true

  # Test scenarios
  scenarios:
    - "clean_documents"  # Perfect quality
    - "noisy_scans"  # Realistic scans
    - "handwritten"  # Handwritten notes
    - "mixed_languages"  # Multi-language documents
    - "complex_layouts"  # Tables, forms, etc.

# Production Settings
production:
  model_path: "./models/lora_adapters/best_model"
  enable_caching: true
  cache_size: 100  # Number of documents to cache

  # API settings
  api:
    enabled: false
    host: "0.0.0.0"
    port: 8000
    max_requests: 100
    timeout: 30  # seconds

  # Safety checks
  safety:
    double_check_phi: true  # Run detection twice
    minimum_confidence: 0.9
    log_all_detections: true